name: check
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # upgrade tests read old template versions from history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (test-only, to lint a strict sample project; the harness itself stays stdlib only)
        run: python -m pip install -q ruff
      - name: Unit + end-to-end tests (apply template, check, upgrade, devserver)
        run: python -m unittest discover -s tests -v
